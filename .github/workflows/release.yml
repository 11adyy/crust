name: Windows package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
      - name: Package executable and runtime assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/crust
          Copy-Item target/x86_64-pc-windows-msvc/release/crust.exe dist/crust/
          Copy-Item -Recurse assets dist/crust/
          Copy-Item LICENSE,README.md dist/crust/
          Compress-Archive -Path dist/crust/* -DestinationPath crust-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: crust-windows
          path: crust-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: crust-windows.zip
          generate_release_notes: false
